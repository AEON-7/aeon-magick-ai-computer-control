[package]
name = "aeon-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { workspace = true }
hyper = { workspace = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = { version = "0.9", default-features = false, features = ["client"] }
http-body-util = "0.1"
bytes = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
rustls = "0.23"
rcgen = "0.13"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
urlencoding = "2.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
# v59: blocking HTTP client for VPN-provider API integrations. Each
# call is infrequent (setup wizard + occasional refresh) so the
# simple sync path beats spinning up an async client.
ureq = { version = "2.10", features = ["json", "tls"] }
# v77: extract AirVPN's config-generator zip packages (download=zip) in
# process. Minimal features — AirVPN packages are deflate/stored only.
zip = { version = "2", default-features = false, features = ["deflate"] }
# E2: web SSH terminal — a real PTY so full-screen TUIs (vim/htop), colors,
# resize and ctrl-keys work end-to-end. The agent-connect `ssh` is spawned
# inside this PTY and bridged to an xterm.js client over a WebSocket.
portable-pty = "0.8"

[[bin]]
name = "aeon-supervisor"
path = "src/main.rs"
