[workspace]
resolver = "2"
members = [
    "acursed-streamer",
    "acursed-hid",
    "acursed-supervisor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Albert"]
repository = "https://github.com/albert/aeon-cursed-kvm"

[workspace.dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
hyper = { version = "1" }

# Linux / sysfs syscalls (pure Rust; we shell out to v4l2-ctl for capture queries)
nix = { version = "0.27", features = ["fs", "process", "signal"] }

# Misc
bytes = "1"
once_cell = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
