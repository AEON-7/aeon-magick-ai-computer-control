# Default acursed-hid config.

# Pick one: "generic-composite", "logitech-mx", "apple-magic"
persona = "logitech-mx"

# The Pi 4 USB-C UDC; on Pi 5 set to "1000480000.usb"
# udc = "fe980000.usb"   # auto-detected; uncomment to pin

configfs_root = "/sys/kernel/config/usb_gadget"
gadget_name = "acursed"
api_sock = "/run/acursed/hid.sock"
