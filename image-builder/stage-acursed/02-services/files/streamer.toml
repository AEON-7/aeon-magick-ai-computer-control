# Default acursed-streamer config. Per-device overrides go in
# /etc/acursed/streamer.local.toml (which the daemon merges on top of this).

device = "/dev/kvmd-video"
api_sock = "/run/acursed/streamer.sock"
ustreamer_sock = "/run/acursed/ustreamer.sock"
jpeg_quality = 80
drop_same_frames = 30
ustreamer_bin = "/usr/bin/ustreamer"
run_as = "acursed"
# platform = "Pi4"   # auto-detected, override if needed
