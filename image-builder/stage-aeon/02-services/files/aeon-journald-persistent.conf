# Aeon Magick: keep journals across reboots.
#
# Pi OS ships Storage=volatile (40-rpi-volatile-storage.conf), which wipes every
# boot's logs on power-cut — exactly when we need them (UPS false poweroffs,
# undervolt sticky bits, CSI capture storms). Override to persistent so the
# next hard cut leaves a post-mortem in /var/log/journal.
[Journal]
Storage=persistent
SystemMaxUse=200M
RuntimeMaxUse=50M
