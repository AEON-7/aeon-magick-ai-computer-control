# Aeon Magick — network configuration.
#
# Three sections cover three layers, in increasing order of advancedness:
#
#   [usb_ethernet] — the USB-C composite device's optional ethernet
#                    function. When enabled, the host PC sees a CDC ECM
#                    USB ethernet adapter alongside HID. `mode` controls
#                    what the host can reach through it.
#
#   [dnscrypt]     — optional encrypted DNS resolver. When enabled,
#                    aeon's dnsmasq forwards to a local dnscrypt-proxy
#                    instance instead of the LAN's plaintext resolver.
#                    Plaintext DNS on usb0 is then never seen on the wire.
#
#   [vpn]          — optional WAN-side tunnel. One of Tailscale / WireGuard
#                    / OpenVPN. When set, all WAN-bound traffic (including
#                    the NAT'd USB ethernet host) routes through the tunnel.
#
# All three are independent — you can use any subset.

# ──────────────────────────────────────────────────────────────────────
# USB ethernet passthrough
# ──────────────────────────────────────────────────────────────────────
#
# `mode` controls what the connected host can reach:
#   "isolation"  — host can reach this Pi's services + internet (NAT'd
#                  through Pi's upstream). CANNOT reach LAN devices
#                  (192.168.x, 10.x, 172.16.x). DEFAULT. Use this for
#                  guest laptops or any time you want hard separation
#                  between the USB-connected host and your home LAN.
#   "sharing"    — host gets full LAN access. Use only on trusted networks.
#   "restricted" — host has WAN access only. Cannot see this Pi AT ALL —
#                  no KVM web UI, no SSH, no ping. Only DHCP + DNS pass
#                  through to the Pi (the bare minimum to get an IP and
#                  resolve names). Use when you want the Pi to be a
#                  completely invisible network gateway with no
#                  management surface from the host side.
#
# All three modes still serve DHCP + (optionally) DNSCrypt to the host.

[usb_ethernet]
enabled = false
mode = "isolation"

# Subnet the Pi serves to the connected host. Pick something unlikely to
# collide with the host's other interfaces. 10.55.0.0/24 is the default
# because it rarely conflicts with home LANs.
subnet = "10.55.0.0/24"
pi_addr = "10.55.0.1"
dhcp_start = "10.55.0.10"
dhcp_end = "10.55.0.50"

# MAC addresses for the gadget's two endpoints. Locally-administered (the
# 02:XX prefix is the LAA bit). Stable across reboots so the host's DHCP
# lease for usb0 stays consistent.
host_mac = "02:42:ae:00:55:01"
dev_mac  = "02:42:ae:00:55:02"

# ──────────────────────────────────────────────────────────────────────
# Encrypted DNS (DNSCrypt v2)
# ──────────────────────────────────────────────────────────────────────
#
# When enabled, a local dnscrypt-proxy listens on 127.0.2.1:53 and the
# Pi's dnsmasq (which serves DHCP clients on usb0) forwards to it. The
# upstream provider sees encrypted DNSCrypt queries; the local network
# sees only encrypted DNSCrypt traffic from the Pi — no plaintext DNS,
# and (unlike DoH) no resolver hostname leaking via TLS SNI.
#
# v50: provider list is DNSCrypt-native only. Cloudflare / NextDNS /
# Mullvad don't run DNSCrypt v2 servers — only DoH/DoT — so they were
# removed. Users who want them can paste an sdns:// stamp into the
# Custom slot at runtime.
#
# `provider` picks the upstream:
#   "quad9"              — Quad9 (DNSCrypt, malware filter, Swiss no-log)
#   "quad9-unfiltered"   — Quad9 (DNSCrypt, no filter, no-log)
#   "adguard"            — AdGuard (DNSCrypt, ad + tracker filter)
#   "adguard-family"     — AdGuard (DNSCrypt, ad+tracker+adult filter)
#   "adguard-unfiltered" — AdGuard (DNSCrypt, no filter, anonymized stats)
#   "opendns"            — Cisco OpenDNS (DNSCrypt, malware filter)
#   "cleanbrowsing"      — CleanBrowsing Security (DNSCrypt, malware filter)
#   "custom"             — paste an sdns:// stamp via the API
#
# `location` is the preferred server region — dnscrypt-proxy weights
# resolver selection. "auto" lets it pick by latency.
#   "auto" | "us" | "eu" | "asia"

[dnscrypt]
enabled = false
provider = "quad9"
location = "auto"
# v56: default to criteria-based auto-pick across the full ~226-server
# catalog. dnscrypt-proxy's lb_strategy="p2" routes per-query to the
# lowest-latency server matching the criteria — and when anonymized
# DNSCrypt is also enabled (below), the latency probe goes THROUGH the
# relay path, so picks reflect the real end-to-end round trip. Switch
# to "specific" + set `provider` if you want a pinned resolver.
server_mode = "auto"
auto_picked_servers = []

# Auto-pick criteria. v56 defaults strict-but-livable: every privacy
# lever on, min_trust_score=4. Yields ~86 candidates spread across
# 4-5 operators in 48 countries.
[dnscrypt.auto_criteria]
no_logs = true
dnssec = true
no_filter = true
outside_five_eyes = true
outside_fourteen_eyes = true
min_trust_score = 4

# Anonymized DNSCrypt (v51+). Off by default; opt-in via
# PUT /api/network/dnscrypt {anonymized: {...}}. When enabled,
# queries ride through one of several relays so the resolver never
# sees the client IP and the relay never sees the queries. Adds
# ~30-100ms of latency per uncached lookup but a meaningful step up
# in privacy — especially when Tor is also active. The supervisor
# auto-picks 3 relays from 3 different operators by default;
# picked_relays gets rewritten on every config save.
[dnscrypt.anonymized]
enabled = false
mode = "auto"
picked_relays = []

[dnscrypt.anonymized.criteria]
no_logs = true
outside_five_eyes = true
outside_fourteen_eyes = false
dnssec = true

# ──────────────────────────────────────────────────────────────────────
# VPN — WAN-side tunnel / anonymity overlay
# ──────────────────────────────────────────────────────────────────────
#
# `provider` is one of:
#   "none"      — no tunnel
#   "tailscale" — WireGuard mesh; provide a one-time auth key
#   "wireguard" — paste a working .conf
#   "openvpn"   — paste a working .ovpn
#   "tor"       — install + run system tor; transparently route all TCP
#                 + DNS through it via iptables REDIRECT. UDP can't go
#                 through Tor and is dropped while this is active.
#   "i2p"       — install + run i2pd; HTTP/SOCKS gateway on localhost.
#                 Only TCP via the proxy; UDP dropped.
#
# `kill_switch = true` forces ALL WAN traffic through the active tunnel.
# Without the tunnel up, traffic is dropped. Loopback + the configured
# LAN management subnet always stay reachable so you can SSH/web-UI in
# even when the tunnel is down. For Tor/I2P the transparent-redirect
# rules ARE the kill-switch (nothing escapes), and this flag controls
# whether to additionally block UDP (so a leaky app can't sneak around
# Tor via DNS-over-UDP, etc.).

[vpn]
enabled = false
provider = "none"
# Lock down traffic when tunnel is up — see explanation above.
kill_switch = false
# Subnet whose traffic is exempt from kill-switch — used so you can
# always reach the Pi's web UI / SSH from the LAN. Set empty string to
# disable the exemption (no LAN bypass at all).
lan_bypass = "192.168.0.0/16"

[vpn.tailscale]
auth_key = ""
hostname = ""
exit_node = false
advertise_exit_node = false

[vpn.wireguard]
config = ""

[vpn.openvpn]
config = ""
auth_username = ""
auth_password = ""

# Tor: transparent-proxy + DNS-over-Tor.
#   preset        — pre-canned bridge configuration:
#                     "direct"   — no bridges (default; works on
#                                  unrestricted networks)
#                     "obfs4"    — use built-in obfs4 bridges from
#                                  the Tor Browser default set
#                                  (rotates with Tor releases)
#                     "meek-azure" — meek transport fronting through
#                                  Microsoft's Azure CDN; looks like
#                                  HTTPS to Microsoft. Works in many
#                                  countries where obfs4 is blocked.
#                     "snowflake" — WebRTC-based ephemeral bridges;
#                                  requires snowflake-client binary.
#                     "custom"   — use the `bridges` field below
#   bridges       — paste bridge lines manually, one per line. Only
#                   used when preset="custom". Get fresh bridges from
#                   https://bridges.torproject.org/
#   exit_country  — ISO-3166 country code for forced exit nodes (e.g.
#                   "us", "de", "nl"). Empty = let Tor pick by
#                   performance.
#   meek_mode     — DEPRECATED: use preset="meek-azure" instead. Kept
#                   for backwards compatibility.

[vpn.tor]
preset = "direct"
bridges = ""
exit_country = ""
meek_mode = false

# I2P (i2pd): outproxy lets your I2P-routed traffic reach the regular
# internet via a public outproxy. Empty = .i2p sites only (the safest
# default; outproxies are inherently less private than VPN endpoints).
[vpn.i2p]
outproxy = ""
