# AEON Magick — default ALSA map for BrainCraft WM8960 (and similar).
#
# The WM8960 stereo codec is the only real mic/speaker card on an Orb with a
# BrainCraft HAT. HDMI cards (vc4-hdmi-0/1) are *outputs only* and must never
# become the default capture path. Bare `hw:0` is fragile (index can move)
# and rejects mono/16 kHz opens the ASR path needs — always plug-convert.
#
# Named PCMs (use these from daemons / curl / debugging):
#   aeon           — stereo plug to WM8960 (playback + capture)
#   aeon_play      — same, explicit playback
#   aeon_cap       — same, explicit capture
#   default        — asym: play+cap through aeon (system default)

# Resolve by *card id*, not numeric index, so card renumbering can't
# silently point TTS at HDMI.
pcm.aeon {
    type plug
    slave {
        pcm "hw:CARD=wm8960soundcard,DEV=0"
        channels 2
    }
    hint {
        show on
        description "AEON BrainCraft WM8960 (speakers + stereo mics)"
    }
}

pcm.aeon_play {
    type plug
    slave.pcm "hw:CARD=wm8960soundcard,DEV=0"
    hint.description "AEON speakers / headphone (WM8960)"
}

pcm.aeon_cap {
    type plug
    slave.pcm "hw:CARD=wm8960soundcard,DEV=0"
    hint.description "AEON stereo mics (WM8960)"
}

# Softvol wrappers so apps that only touch "Master" still move Speaker.
pcm.aeon_soft {
    type softvol
    slave.pcm "aeon"
    control {
        name "AEON Master"
        card wm8960soundcard
    }
}

pcm.!default {
    type asym
    playback.pcm "aeon"
    capture.pcm "aeon"
}

ctl.!default {
    type hw
    card wm8960soundcard
}
