# Default aeon-streamer config.

device = "/dev/kvmd-video"
api_sock = "/run/aeon/streamer.sock"
ustreamer_sock = "/run/aeon/ustreamer.sock"
# v63: defaults dropped from 80→70. JPEG quality 70 is visually
# indistinguishable from 80 for screen content (UI elements, text,
# desktop) but cuts wire size ~30%, which lets WiFi / browser-side
# multipart parsers drain frames faster — most "3s lag" reports turn
# out to be TCP/browser buffering, not encode cost. Tunable live via
# PUT /api/streamer/config or the slider on /system.
jpeg_quality = 70
drop_same_frames = 30
ustreamer_bin = "/usr/bin/ustreamer"
ffmpeg_bin = "/usr/bin/ffmpeg"
run_as = "aeon"
# platform = "Pi4"   # auto-detected, override if needed

# The [output] block kicks in ONLY when the capture device offers a
# format ustreamer can't ingest natively (Cam Link at 4K = NV12/YU12 only).
# In that case aeon-streamer spawns ffmpeg to ingest the source, rescale
# to width × height below, and serve the result.
#
# When the source already offers YUYV / UYVY / MJPG (Cam Link at ≤1080p),
# the ustreamer fast path runs and these knobs are ignored — frames flow
# through at the source resolution.
[output]
# match_source = true tracks the *source* resolution exactly (capped at the
# H.264 encoder's 1920×1080 ceiling) and skips the scale filter entirely when
# output == source — so a ≤1080p host streams native with zero resampling
# (lower CPU, sharper text). Re-detected live when the source res changes.
# Leave false to force the fixed width × height below.
# Default true: with the H.264 default, native-res ≤1080p hosts stream with
# zero resampling — the scale filter collapses to a cheap range-only pass,
# keeping CPU near ~0.5 core. (false + a 1080p target would software-upscale
# a 720p source for no visible gain.)
match_source = true
# Used when match_source = false. Pick width × height to match your host's
# *logical* (post-Retina) screen size so agent pointer coords map 1:1 with
# what the human sees:
#   M1 MBP 13" default scale  → 1440x900
#   M2/M3 MBA 13"             → 1470x956
#   M2/M3 MBP 14" default     → 1512x982
#   M2/M3 MBP 16" default     → 1728x1117
#   Pure 1080p host           → 1920x1080
width = 1920
height = 1080
# fps: the Cam Link captures at 60 fps (≤1080p), so output fps should be a
# clean divisor — 15, 30, or 60 — so frames drop evenly (the /system selector
# and PUT /api/streamer/config snap to these; 24 would force an uneven 2-of-5
# cadence). The H.264 *encoder* is cheap (Pi 4 hardware), but ffmpeg's
# color/range conversion (swscale) runs per OUTPUT frame — we decimate to
# `fps` at the head of the filter graph — so fps does drive CPU: ~0.5 core
# at 30, ~1 core at 60 (720p source). 30 is the balanced default; 60 for
# smoother motion (≈2× CPU); 15 to minimise bandwidth + CPU.
fps = 30
# format: "h264" (default) streams H.264 over a WebSocket to the browser's
# WebCodecs decoder — low latency + low CPU. The encoder is picked per
# platform at runtime: Pi 4 → hardware h264_v4l2m2m; Pi 5 (no HW encoder)
# → software libx264 ultrafast/zerolatency, which its cores handle at 1080p30.
# Browsers without WebCodecs auto-fall-back to the MJPEG <img> (the snapshot
# served at a few fps); agents always have /snapshot. "mjpeg" forces the
# legacy software-MJPEG path (no HW JPEG encoder exists on this ustreamer
# build, so it's CPU-bound — fine at low fps, heavy at 60).
format = "h264"                # "h264" (default) or "mjpeg"
scale_algorithm = "bicubic"    # "lanczos" (best) | "bicubic" (default) | "neighbor" (fastest)
snapshot_path = "/run/aeon/snapshots/live.jpg"
mjpeg_tcp_port = 8002

# Use Pi 4 GPU hardware scaler (scale_v4l2m2m) instead of CPU scale.
# Pi 4 ONLY — the Pi 5 has no v4l2m2m scaler, so this flag is ignored there.
# Saves ~300-500 mA under active streaming. Default false — flip to true
# after confirming basic streaming works; if frames stop arriving, flip
# back. (Some pixel formats aren't supported by the m2m scaler on every
# kernel version.)
hw_accel = false
